<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Herramientas TI</title>
<style>
body{background:#0f172a;color:#fff;font-family:Segoe UI;margin:0;padding:20px}
.card{max-width:1100px;margin:auto;background:#020617;padding:20px;border-radius:12px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{padding:10px 15px;border:1px solid #334155;border-radius:8px;cursor:pointer}
.tab.active{background:#22c55e;color:#000;font-weight:bold}
.section{display:none}.section.active{display:block}
.preview{background:#000;color:#22c55e;padding:12px;border-radius:8px;margin-top:10px}
label{display:block;margin-top:10px}
input,select,button{width:100%;padding:10px;margin-top:5px;border-radius:8px}
button{background:#22c55e;border:0;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>Portal Herramientas TI</h1>

<div class="tabs">
<div class="tab active" onclick="tab('generador',this)">Generador</div>
<div class="tab" onclick="tab('diagnostico',this)">Diagnóstico</div>
<div class="tab" onclick="tab('priorizacion',this)">Priorización</div>
</div>

<div id="generador" class="section active">
<label>Empresa</label>
<select id="empresa"><option>COL</option><option>CON</option></select>
<label>Tipo</label>
<select id="tipo"><option>LP</option><option>DT</option></select>
<label>Área</label>
<select id="area"><option>TI</option><option>SAC</option></select>
<label>Serial</label>
<input id="serial">
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="serialMode='last';generar()">Últimos 4</button>
<button onclick="serialMode='first';generar()">Primeros 4</button>
</div>
<div id="preview" class="preview">COL-LP-TI-XXXX</div>
</div>

<div id="diagnostico" class="section">
<p>Área de diagnóstico lista para ampliar.</p>
</div>

<div id="priorizacion" class="section">
<label>Impacto</label>
<select id="impacto" onchange="calc()"><option value="1">1</option><option value="5">5</option></select>
<label>Urgencia</label>
<select id="urgencia" onchange="calc()"><option value="1">1</option><option value="5">5</option></select>
<label>Riesgo</label>
<select id="riesgo" onchange="calc()"><option value="1">1</option><option value="5">5</option></select>
<label>Usuario</label>
<select id="usuario" onchange="calc()"><option value="1">Operativo</option><option value="5">VIP</option></select>
<div id="resultado" class="preview">P4 - BAJA</div>
</div>
</div>

<script>
let serialMode='last';
function tab(id,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
function generar(){
let s=document.getElementById('serial').value.trim().toUpperCase();
if(s.length>=4)s=(serialMode==='last'?s.slice(-4):s.slice(0,4));
document.getElementById('preview').innerText=[empresa.value,tipo.value,area.value,s].filter(Boolean).join('-');
}
empresa.onchange=tipo.onchange=area.onchange=generar;
serial.oninput=generar;
function calc(){
let t=[impacto,urgencia,riesgo,usuario].reduce((a,e)=>a+parseInt(e.value),0);
document.getElementById('resultado').innerText=t>=17?'P1 - CRÍTICA':t>=13?'P2 - ALTA':t>=9?'P3 - MEDIA':'P4 - BAJA';
}
</script>
</body>
</html>
